
default:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  image: gitlab.ewi.tudelft.nl/cse3100/admin/docker-ci-image-builder@sha256:3559e6d25fd2ccd6d069bcbb405d378c6cdad5f1aabc863ba58c2b65c80e2227

stages:
- build
- test

build:
  stage: build
  artifacts:
    expire_in: 4 weeks
  before_script:
  - cp -r ~/.cabal .
  - cp -r /dist-newstyle .
  - cabal v2-configure --enable-tests
  script:
  - cabal v2-build exe:jq-clone


from-upstream:
  stage: test
  artifacts:
    expire_in: 4 weeks
  before_script:
  - cp -r ~/.cabal .
  - cp -r /dist-newstyle .
  - cabal v2-configure --enable-tests
  script:
  - cabal test from-upstream

week3:
  stage: test
  artifacts:
    expire_in: 4 weeks
  before_script:
  - cp -r ~/.cabal .
  - cp -r /dist-newstyle .
  - cabal v2-configure --enable-tests
  script:
  - cabal test week3

week4:
  stage: test
  artifacts:
    expire_in: 4 weeks
  before_script:
  - cp -r ~/.cabal .
  - cp -r /dist-newstyle .
  - cabal v2-configure --enable-tests
  script:
  - cabal test week4

unit-tests:
  stage: test
  artifacts:
    expire_in: 4 weeks
  before_script:
  - cp -r ~/.cabal .
  - cp -r /dist-newstyle .
  - cabal v2-configure --enable-tests
  script:
  - cabal test unit-tests
